name: Deploy to Hostinger

on:
  workflow_dispatch:  # Bisa dijalankan manual via GitHub Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build project (Vite)
      - name: Build project
        run: npm run build

      # 5. Deploy isi folder dist/ ke public_html/ via FTP
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/            # isi folder dist
          server-dir: /public_html/   # langsung ke public_html, tanpa folder dist
          git-ftp-args: --disable-ansi --no-prompt --no-version-check
