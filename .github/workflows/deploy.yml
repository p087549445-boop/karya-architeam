
name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # penting biar worktree bisa jalan

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Jalankan deploy.sh
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Push hasil build ke branch deploy
        run: |
          cd ../deploy-worktree
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git push origin deploy
