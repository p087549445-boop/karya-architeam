name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # penting biar bisa checkout branch deploy

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy ke branch deploy
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Checkout branch deploy ke folder terpisah
          git worktree add ../deploy-worktree deploy

          # Hapus isi lama
          rm -rf ../deploy-worktree/*

          # Copy hasil build
          cp -r dist/* ../deploy-worktree/

          cd ../deploy-worktree
          git add .
          git commit -m "Deploy build $(date +'%Y-%m-%d %H:%M:%S')" || echo "⚠️ Tidak ada perubahan"
          git push origin deploy
          git push origin deploy
